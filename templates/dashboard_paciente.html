{% extends "base.html" %}

{% block conteudo %}
<style>
    header, .top-bar, .navbar, .header-container, [class*="nav"], [class*="header"] { display: none !important; }
</style>

<div style="padding: 40px 60px !important; background: #ffffff !important; min-height: 100vh !important; box-sizing: border-box !important; max-width: 1200px !important; margin: 0 auto !important;">
    
    <div style="display: flex !important; justify-content: space-between !important; align-items: center !important; margin-bottom: 35px !important;">
        <div>
            <h1 style="font-size: 26px !important; font-weight: 700 !important; color: #a10f06 !important; margin-bottom: 4px !important;">
                Olá, João Silva (Paciente)
            </h1>
            <p style="font-size: 13px !important; color: #6b7280 !important; font-weight: 600 !important; margin: 0 !important; text-transform: uppercase;">
                Seu Painel de Saúde &bull; Cuidador: Ana Paula
            </p>
        </div>
        <a href="/logout" style="background: #f3f4f6 !important; color: #374151 !important; padding: 10px 18px !important; border-radius: 10px !important; font-size: 13px !important; font-weight: 600 !important; text-decoration: none !important;">Sair</a>
    </div>

    <div style="display: grid !important; grid-template-columns: repeat(2, 1fr) !important; gap: 24px !important;">
        
        <!-- Registrar Medição -->
        <div style="background: #fdfdfd; padding: 30px; border-radius: 20px; border: 1px solid #eaeaea; box-shadow: 0 4px 15px rgba(0,0,0,0.02);">
            <h3 style="font-size: 18px; font-weight: 700; color: #111827; margin-bottom: 15px;">Nova Medição de Glicemia</h3>
            <form onsubmit="event.preventDefault(); alert('Medição registrada com sucesso e enviada ao médico!');">
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 13px; font-weight: 600; color: #374151; display: block; margin-bottom: 6px;">Valor (mg/dL):</label>
                    <input type="number" placeholder="Ex: 115" required style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 10px; outline: none; box-sizing: border-box;">
                </div>
                <button type="submit" style="width: 100%; background-color: #a10f06; color: white; padding: 12px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer;">Registrar Medição</button>
            </form>
        </div>

        <!-- Meus Medicamentos e Avisos -->
        <div style="background: #fdfdfd; padding: 30px; border-radius: 20px; border: 1px solid #eaeaea; box-shadow: 0 4px 15px rgba(0,0,0,0.02);">
            <h3 style="font-size: 18px; font-weight: 700; color: #111827; margin-bottom: 15px;">Próximos Medicamentos</h3>
            <div style="background: #ffffff; padding: 16px; border-radius: 12px; border-left: 4px solid #a10f06; margin-bottom: 12px;">
                <strong>Insulina NPH</strong>
                <p style="font-size: 13px; color: #6b7280; margin: 4px 0 0 0;">Horário: 12:00 (Antes do almoço)</p>
            </div>
            <div style="background: #ffffff; padding: 16px; border-radius: 12px; border-left: 4px solid #128c7e;">
                <strong>Metformina 850mg</strong>
                <p style="font-size: 13px; color: #6b7280; margin: 4px 0 0 0;">Horário: 20:00 (Após o jantar)</p>
            </div>
        </div>

    </div>

</div>
{% endblock %}
