{% extends "base.html" %}

{% block conteudo %}

<h2>Cadastrar Novo Medicamento</h2>

<form action="/medicamentos/cadastrar" method="POST">
    <p>
        <label>Paciente:</label><br>
        <select name="id_paciente" required>
            <option value="">Selecione o paciente</option>
            {% for paciente in pacientes %}
                <option value="{{ paciente.id_paciente }}">{{ paciente.nome }}</option>
            {% endfor %}
        </select>
    </p>

    <p>
        <label>Nome do Medicamento:</label><br>
        <input type="text" name="nome_medicamento" required>
    </p>

    <p>
        <label>Informação de Uso:</label><br>
        <input type="text" name="informacao_uso" placeholder="Ex: 1 comprimido de 8h em 8h" required>
    </p>

    <p>
        <label>Data de Início:</label><br>
        <input type="date" name="data_inicio" required>
    </p>

    <p>
        <label>Observações:</label><br>
        <textarea name="observacoes" rows="3"></textarea>
    </p>

    <p>
        <button type="submit">Salvar Medicamento</button>
        <a href="/medicamentos">Cancelar</a>
    </p>
</form>

{% endblock %}
