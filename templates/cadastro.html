{% extends "base.html" %}

{% block conteudo %}
<div style="position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; background: #ffffff !important; z-index: 999999 !important; display: flex !important; align-items: center !important; justify-content: center !important; overflow-y: auto !important;">
    
    <div style="width: 100vw !important; min-height: 100vh !important; display: grid !important; grid-template-columns: 1fr 1.1fr !important; gap: 40px !important; padding: 40px 60px !important; box-sizing: border-box !important; background: #ffffff !important; align-items: center !important;">
        
        <!-- Coluna Esquerda: Slider Automático com as Cores Originais e Logo Gigante Vazando na Margem -->
        <div style="position: relative !important; width: 100% !important; height: 85vh !important; border-radius: 28px !important; overflow: visible !important; box-shadow: 0 15px 35px rgba(0,0,0,0.1) !important; background: #000;">
            
            <!-- Slides Automáticos (4 Imagens Locais com Cores Originais e sem escurecer) -->
            <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 28px; overflow: hidden;">
                <div class="gc-slide" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 1; transition: opacity 1s ease-in-out;">
                    <img src="{{ url_for('static', filename='img/slide-1.png') }}" alt="Slide 1" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div class="gc-slide" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1s ease-in-out;">
                    <img src="{{ url_for('static', filename='img/slide-2.png') }}" alt="Slide 2" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div class="gc-slide" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1s ease-in-out;">
                    <img src="{{ url_for('static', filename='img/slide-3.png') }}" alt="Slide 3" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div class="gc-slide" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1s ease-in-out;">
                    <img src="{{ url_for('static', filename='img/slide-4.png') }}" alt="Slide 4" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
            </div>

            <!-- Monograma "G" Gigante, Branco, sem fundo, ultrapassando a margem inferior esquerda -->
            <div style="position: absolute !important; bottom: -45px !important; left: -45px !important; z-index: 10 !important; pointer-events: none !important; width: 440px !important;">
                <img src="{{ url_for('static', filename='img/glicocheck-monograma-g.svg') }}" alt="Monograma G Gigante" style="width: 100% !important; height: auto !important; object-fit: contain !important; display: block !important; filter: brightness(0) invert(1) drop-shadow(0 15px 35px rgba(0,0,0,0.5)) !important;">
            </div>
        </div>

        <!-- Coluna Direita: Formulário de Cadastro Completo -->
        <div style="display: flex !important; flex-direction: column !important; justify-content: center !important; width: 100% !important; max-width: 460px !important; margin: 0 auto !important; background: transparent !important;">
            
            <h2 style="font-size: 24px !important; font-weight: 700 !important; color: #111827 !important; margin-bottom: 18px !important; line-height: 1.2 !important;">Criar sua conta no GlicoCheck</h2>

            {% if erro %}
                <div style="background-color: #fee2e2 !important; color: #dc2626 !important; padding: 10px 14px !important; border-radius: 10px !important; font-size: 13px !important; margin-bottom: 16px !important; border: 1px solid #fca5a5 !important;">
                    {{ erro }}
                </div>
            {% endif %}

            <form action="/cadastro" method="POST" style="width: 100% !important;">
                
                <!-- Nome completo -->
                <div style="margin-bottom: 12px !important;">
                    <label style="display: block !important; font-size: 11px !important; font-weight: 600 !important; color: #374151 !important; margin-bottom: 4px !important;">Nome completo</label>
                    <input type="text" name="nome" placeholder="Seu nome completo" required autofocus style="width: 100% !important; padding: 10px 14px !important; border: 1px solid #e5e7eb !important; border-radius: 10px !important; background: #f9fafb !important; font-size: 13px !important; box-sizing: border-box !important; outline: none !important;">
                </div>

                <!-- Data de nascimento e Telefone -->
                <div style="display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 12px !important; margin-bottom: 12px !important;">
                    <div>
                        <label style="display: block !important; font-size: 11px !important; font-weight: 600 !important; color: #374151 !important; margin-bottom: 4px !important;">Data nascimento</label>
                        <input type="date" name="data_nascimento" required style="width: 100% !important; padding: 10px 14px !important; border: 1px solid #e5e7eb !important; border-radius: 10px !important; background: #f9fafb !important; font-size: 13px !important; box-sizing: border-box !important; outline: none !important; color: #374151 !important;">
                    </div>
                    <div>
                        <label style="display: block !important; font-size: 11px !important; font-weight: 600 !important; color: #374151 !important; margin-bottom: 4px !important;">Telefone</label>
                        <input type="text" name="telefone" placeholder="(00) 00000-0000" required style="width: 100% !important; padding: 10px 14px !important; border: 1px solid #e5e7eb !important; border-radius: 10px !important; background: #f9fafb !important; font-size: 13px !important; box-sizing: border-box !important; outline: none !important;">
                    </div>
                </div>

                <!-- E-mail -->
                <div style="margin-bottom: 12px !important;">
                    <label style="display: block !important; font-size: 11px !important; font-weight: 600 !important; color: #374151 !important; margin-bottom: 4px !important;">E-mail</label>
                    <input type="email" name="email" placeholder="Ex: glicocheck26@gmail.com" required style="width: 100% !important; padding: 10px 14px !important; border: 1px solid #e5e7eb !important; border-radius: 10px !important; background: #f9fafb !important; font-size: 13px !important; box-sizing: border-box !important; outline: none !important;">
                </div>

                <!-- Perfil (Select Ajustado) -->
                <div style="margin-bottom: 12px !important;">
                    <label style="display: block !important; font-size: 11px !important; font-weight: 600 !important; color: #374151 !important; margin-bottom: 4px !important;">Como você deseja utilizar o GlicoCheck?</label>
                    <div style="position: relative !important; width: 100% !important;">
                        <select name="tipo" required style="width: 100% !important; padding: 10px 36px 10px 14px !important; border: 1px solid #e5e7eb !important; border-radius: 10px !important; background: #f9fafb !important; font-size: 13px !important; box-sizing: border-box !important; outline: none !important; color: #374151 !important; appearance: none !important; -webkit-appearance: none !important; -moz-appearance: none !important; cursor: pointer !important;">
                            <option value="" disabled selected>Selecione seu perfil</option>
                            <option value="paciente">Paciente</option>
                            <option value="medico">Médico</option>
                            <option value="cuidador">Cuidador</option>
                        </select>
                        <!-- Ícone de Seta Personalizado Perfeitamente Centralizado -->
                        <div style="position: absolute !important; right: 14px !important; top: 50% !important; transform: translateY(-50%) !important; pointer-events: none !important; color: #6b7280 !important; display: flex !important; align-items: center !important;">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Criar Senha e Valide a Senha -->
                <div style="display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 12px !important; margin-bottom: 18px !important;">
                    <div>
                        <label style="display: block !important; font-size: 11px !important; font-weight: 600 !important; color: #374151 !important; margin-bottom: 4px !important;">Criar Senha</label>
                        <input type="password" id="senha" name="senha" placeholder="Mínimo 6 dígitos" required style="width: 100% !important; padding: 10px 14px !important; border: 1px solid #e5e7eb !important; border-radius: 10px !important; background: #f9fafb !important; font-size: 13px !important; box-sizing: border-box !important; outline: none !important;">
                    </div>
                    <div>
                        <label style="display: block !important; font-size: 11px !important; font-weight: 600 !important; color: #374151 !important; margin-bottom: 4px !important;">Valide a Senha</label>
                        <input type="password" id="confirma_senha" name="confirma_senha" placeholder="Valide a senha" required style="width: 100% !important; padding: 10px 14px !important; border: 1px solid #e5e7eb !important; border-radius: 10px !important; background: #f9fafb !important; font-size: 13px !important; box-sizing: border-box !important; outline: none !important;">
                    </div>
                </div>

                <!-- Botão de Cadastro Vermelho Oficial -->
                <button type="submit" style="width: 100% !important; background-color: #a10f06 !important; color: #ffffff !important; font-size: 14px !important; font-weight: 600 !important; padding: 12px !important; border-radius: 10px !important; border: none !important; cursor: pointer !important; transition: background 0.3s;">Cadastrar na plataforma</button>

                <!-- Rodapé -->
                <p style="text-align: center !important; font-size: 12px !important; color: #6b7280 !important; margin-top: 14px !important;">Já tem uma conta? <a href="/login" style="color: #a10f06 !important; text-decoration: none !important; font-weight: 600 !important;">Entrar</a></p>
            </form>
        </div>
    </div>
</div>

<script>
    // Carrossel Automático para os 4 slides locais
    let currentSlide = 0;
    const slides = document.querySelectorAll('.gc-slide');
    function nextSlide() {
        if (slides.length > 0) {
            slides[currentSlide].style.opacity = 0;
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].style.opacity = 1;
        }
    }
    setInterval(nextSlide, 4000);
</script>
{% endblock %}
