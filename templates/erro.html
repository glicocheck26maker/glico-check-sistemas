{% extends "base.html" %}
{% block titulo %}{{ codigo }} · GlicoCheck{% endblock %}
{% block conteudo %}
<section class="simple-page">
    <div class="content-card glass-panel">
        <span class="section-kicker">GLICOCHECK · {{ codigo }}</span>
        <h1>{{ titulo }}</h1>
        <p class="muted-copy">{{ mensagem }}</p>
        <a class="btn-primary" href="{{ url_for('index') if session.get('user_id') else url_for('landing') }}">Voltar →</a>
    </div>
</section>
{% endblock %}
