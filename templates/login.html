{% extends "base.html" %}

{% block conteudo %}
<div style="position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; background: #ffffff !important; z-index: 999999 !important; display: flex !important; align-items: center !important; justify-content: center !important; overflow-y: auto !important;">
    
    <div style="width: 100vw !important; min-height: 100vh !important; display: grid !important; grid-template-columns: 1fr 1.1fr !important; gap: 40px !important; padding: 40px 60px !important; box-sizing: border-box !important; background: #ffffff !important; align-items: center !important;">
        
        <!-- Coluna Esquerda: Slider com Cores Originais e Logo Gigante -->
        <div style="position: relative !important; width: 100% !important; height: 85vh !important; border-radius: 28px !important; overflow: visible !important; box-shadow: 0 15px 35px rgba(0,0,0,0.1) !important; background: #000;">
            
            <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 28px; overflow: hidden;">
                <div class="gc-slide" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 1; transition: opacity 1s ease-in-out;">
                    <img src="{{ url_for('static', filename='img/slide-1.png') }}" alt="Slide 1" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div class="gc-slide" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1s ease-in-out;">
                    <img src="{{ url_for('static', filename='img/slide-2.png') }}" alt="Slide 2" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div class="gc-slide" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1s ease-in-out;">
                    <img src="{{ url_for('static', filename='img/slide-3.png') }}" alt="Slide 3" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div class="gc-slide" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1s ease-in-out;">
                    <img src="{{ url_for('static', filename='img/slide-4.png') }}" alt="Slide 4" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
            </div>

            <div style="position: absolute !important; bottom: -45px !important; left: -45px !important; z-index: 10 !important; pointer-events: none !important; width: 440px !important;">
                <img src="{{ url_for('static', filename='img/glicocheck-monograma-g.svg') }}" alt="Monograma G Gigante" style="width: 100% !important; height: auto !important; object-fit: contain !important; display: block !important; filter: brightness(0) invert(1) drop-shadow(0 15px 35px rgba(0,0,0,0.5)) !important;">
            </div>
        </div>

        <!-- Coluna Direita: Formulário de Login com Seletor de Perfil -->
        <div style="display: flex !important; flex-direction: column !important; justify-content: center !important; width: 100% !important; max-width: 440px !important; margin: 0 auto !important; background: transparent !important;">
            
            <h2 style="font-size: 26px !important; font-weight: 700 !important; color: #111827 !important; margin-bottom: 20px !important; line-height: 1.2 !important;">Entrar na sua conta</h2>

            {% if erro %}
                <div style="background-color: #fee2e2 !important; color: #dc2626 !important; padding: 10px 14px !important; border-radius: 10px !important; font-size: 13px !important; margin-bottom: 16px !important; border: 1px solid #fca5a5 !important;">
                    {{ erro }}
                </div>
            {% endif %}

            <form action="/login" method="POST" style="width: 100% !important;">
                
                <div style="margin-bottom: 16px !important;">
                    <label for="email" style="display: block !important; font-size: 12px !important; font-weight: 600 !important; color: #374151 !important; margin-bottom: 6px !important;">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Ex: glicocheck26@gmail.com" required autofocus style="width: 100% !important; padding: 12px 14px !important; border: 1px solid #e5e7eb !important; border-radius: 10px !important; background: #f9fafb !important; font-size: 13px !important; box-sizing: border-box !important; outline: none !important;">
                </div>

                <div style="margin-bottom: 16px !important;">
                    <label for="senha" style="display: block !important; font-size: 12px !important; font-weight: 600 !important; color: #374151 !important; margin-bottom: 6px !important;">Senha</label>
                    <div style="position: relative !important; width: 100% !important; display: block !important;">
                        <input type="password" id="senha" name="senha" required placeholder="Digite a sua senha" style="width: 100% !important; padding: 12px 36px 12px 14px !important; border: 1px solid #e5e7eb !important; border-radius: 10px !important; background: #f9fafb !important; font-size: 13px !important; box-sizing: border-box !important; outline: none !important;">
                        <button type="button" onclick="toggleLoginPass()" style="position: absolute !important; right: 10px !important; top: 50% !important; transform: translateY(-50%) !important; width: 24px !important; height: 24px !important; background: transparent !important; border: none !important; cursor: pointer !important; color: #9ca3af !important; padding: 0 !important; display: flex !important; align-items: center !important; justify-content: center !important; z-index: 10 !important;">
                            <svg id="eyeLogin" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- SELETOR DE PERFIL INTEGRADO NO FORMULÁRIO -->
                <div style="margin-bottom: 22px !important;">
                    <label for="perfil" style="display: block !important; font-size: 12px !important; font-weight: 600 !important; color: #374151 !important; margin-bottom: 6px !important;">Entrar como</label>
                    <select id="perfil" name="perfil" style="width: 100% !important; padding: 12px 14px !important; border: 1px solid #e5e7eb !important; border-radius: 10px !important; background: #f9fafb !important; font-size: 13px !important; box-sizing: border-box !important; outline: none !important; cursor: pointer !important;">
                        <option value="cuidador">Cuidador(a)</option>
                        <option value="paciente">Paciente</option>
                        <option value="medico">Médico(a)</option>
                    </select>
                </div>

                <button type="submit" style="width: 100% !important; background-color: #a10f06 !important; color: #ffffff !important; font-size: 14px !important; font-weight: 600 !important; padding: 13px !important; border-radius: 10px !important; border: none !important; cursor: pointer !important; transition: background 0.3s;">Entrar na plataforma</button>

                <p style="text-align: center !important; font-size: 12px !important; color: #6b7280 !important; margin-top: 18px !important;">Ainda não tem conta? <a href="/cadastro" style="color: #a10f06 !important; text-decoration: none !important; font-weight: 600 !important;">Cadastrar-se</a></p>
            </form>
        </div>
    </div>
</div>

<script>
    let currentSlide = 0;
    const slides = document.querySelectorAll('.gc-slide');
    function nextSlide() {
        if (slides.length > 0) {
            slides[currentSlide].style.opacity = 0;
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].style.opacity = 1;
        }
    }
    setInterval(nextSlide, 4000);

    function toggleLoginPass() {
        const input = document.getElementById('senha');
        const icon = document.getElementById('eyeLogin');
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        if (isPassword) {
            icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
        } else {
            icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
        }
    }
</script>
{% endblock %}
