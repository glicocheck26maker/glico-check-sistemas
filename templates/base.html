<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#faf8f5">
    <meta name="description"
          content="GlicoCheck — acompanhamento e monitoramento de glicemia.">

    <title>{% block titulo %}GlicoCheck{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <header class="main-header navbar">
        <a href="{{ url_for('landing') }}" class="brand-logo" style="display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 600; color: #1d1d1f; font-size: 16px;">
            <img src="{{ url_for('static', filename='img/glicocheck-monograma-g.svg') }}" alt="Logo Glicocheck" style="height: 32px; width: auto; display: block; filter: brightness(0) saturate(100%) invert(13%) sepia(85%) saturate(5414%) hue-rotate(354deg) brightness(70%) contrast(97%);">
        
        </a>
    
        <nav class="main-nav">
            {% if session.get('usuario_logado') %}
                <a href="{{ url_for('index') }}">Meu painel</a>
                <a class="nav-logout" href="{{ url_for('logout') }}">Sair</a>
            {% else %}
                <a href="{{ url_for('landing') }}">Início</a>
                <a href="#nossa-historia">Nossa história</a>
                <a href="{{ url_for('login') }}">Entrar</a>
                <a href="{{ url_for('cadastro') }}" class="nav-register">Começar</a>
            {% endif %}
        </nav>
    </header>

    <main class="page-content">
        {% block conteudo %}{% endblock %}
    </main>

    <footer class="main-footer">
        <p>© 2026 GlicoCheck · Cuidado e acompanhamento da glicemia.</p>
    </footer>
</body>
</html>
