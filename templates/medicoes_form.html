{% extends "base.html" %}

{% block conteudo %}

<h2>Cadastrar Nova Medição</h2>

<form action="/medicoes/cadastrar" method="POST">
    <p>
        <label>Paciente:</label><br>
        <select name="id_paciente" required>
            <option value="">Selecione o paciente</option>
            {% for paciente in pacientes %}
                <option value="{{ paciente.id_paciente }}">{{ paciente.nome }}</option>
            {% endfor %}
        </select>
    </p>

    <p>
        <label>Tipo de Medição:</label><br>
        <input type="text" name="tipo_medicao" placeholder="Ex: Jejum, Pós-prandial" required>
    </p>

    <p>
        <label>Valor (mg/dL):</label><br>
        <input type="number" step="0.01" name="valor" required>
    </p>

    <p>
        <label>Data e Hora:</label><br>
        <input type="datetime-local" name="data_hora" required>
    </p>

    <p>
        <label>Observação:</label><br>
        <textarea name="observacao" rows="3"></textarea>
    </p>

    <p>
        <button type="submit">Salvar Medição</button>
        <a href="/medicoes">Cancelar</a>
    </p>
</form>

{% endblock %}
